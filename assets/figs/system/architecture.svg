<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1290" viewBox="0 0 1600 1290" role="img" aria-labelledby="title description">
  <title id="title">DeepTutor 对话执行架构</title>
  <desc id="description">Web、CLI 和 Python SDK 共用 TurnApplicationService。TurnRuntime 管理上下文、状态和事件，通过 TurnEngine 与 ChatOrchestrator 执行 Capability，并调用工具与模型。默认使用 SQLite 和内存协调，可选 PocketBase，多 worker 要求 Redis。StreamBus 将能力产生的事件返回运行时。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="eventArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 18px; fill: #475569; }
      .label { font-size: 23px; font-weight: 650; fill: #0f172a; text-anchor: middle; }
      .detail { font-size: 17px; fill: #334155; text-anchor: middle; }
      .path { font-size: 14px; fill: #64748b; text-anchor: middle; }
      .note { font-size: 16px; fill: #475569; }
      .eyebrow { font-size: 14px; font-weight: 700; fill: #64748b; letter-spacing: 1px; }
      .node { stroke-width: 1.5; rx: 16; }
      .entry { fill: #eff6ff; stroke: #93c5fd; }
      .adapter { fill: #f0fdfa; stroke: #5eead4; }
      .application { fill: #eef2ff; stroke: #a5b4fc; }
      .engine { fill: #f5f3ff; stroke: #c4b5fd; }
      .tool { fill: #f0fdf4; stroke: #86efac; }
      .provider { fill: #fff7ed; stroke: #fdba74; }
      .state { fill: #f8fafc; stroke: #94a3b8; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .bidirectional { marker-start: url(#arrow); }
      .event { fill: none; stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#eventArrow); }
    </style>
  </defs>

  <rect width="1600" height="1290" fill="#ffffff"/>
  <rect x="0" y="0" width="1600" height="8" fill="#4f46e5"/>
  <text class="title" x="70" y="65">DeepTutor 对话执行架构</text>
  <text class="subtitle" x="70" y="101">统一入口 · 持久化回合 · Agent 工作流与工具扩展</text>
  <rect x="1370" y="39" width="160" height="39" rx="19" fill="#eef2ff"/>
  <text x="1450" y="65" text-anchor="middle" font-size="17" fill="#4338ca">源码 v1.6.15</text>

  <text class="eyebrow" x="70" y="144">01  用户入口</text>
  <rect class="node entry" x="70" y="160" width="430" height="100"/>
  <text class="label" x="285" y="199">Web</text>
  <text class="detail" x="285" y="231">Next.js 16 / React 19 / TypeScript</text>

  <rect class="node entry" x="570" y="160" width="430" height="100"/>
  <text class="label" x="785" y="199">CLI</text>
  <text class="detail" x="785" y="231">Typer / Rich / prompt_toolkit</text>

  <rect class="node entry" x="1070" y="160" width="460" height="100"/>
  <text class="label" x="1300" y="199">Python SDK</text>
  <text class="detail" x="1300" y="231">嵌入应用、脚本与自动化</text>

  <path class="edge" d="M285 260 V310"/>
  <path class="edge" d="M785 260 V310"/>
  <path class="edge" d="M1300 260 V310"/>

  <text class="eyebrow" x="70" y="295">02  接口适配</text>
  <rect class="node adapter" x="70" y="310" width="430" height="90"/>
  <text class="label" x="285" y="348">FastAPI WebSocket</text>
  <text class="detail" x="285" y="379">/ws · 命令校验与事件订阅</text>

  <rect class="node adapter" x="570" y="310" width="960" height="90"/>
  <text class="label" x="1050" y="348">DeepTutorApp</text>
  <text class="detail" x="1050" y="379">deeptutor/app/facade.py · CLI 与 SDK 的应用门面</text>

  <path class="edge" d="M285 400 V430 H800 V470"/>
  <path d="M1050 400 V430 H800" fill="none" stroke="#64748b" stroke-width="2"/>

  <text class="eyebrow" x="70" y="455">03  共享应用与执行</text>
  <rect class="node application" x="450" y="470" width="700" height="90"/>
  <text class="label" x="800" y="507">TurnApplicationService</text>
  <text class="detail" x="800" y="538">启动 / 取消 / 重试 / 用户回答 / 订阅与回放</text>

  <path class="edge" d="M800 560 V610"/>
  <rect class="node application" x="450" y="610" width="700" height="100"/>
  <text class="label" x="800" y="648">TurnRuntimeManager</text>
  <text class="detail" x="800" y="679">组装 UnifiedContext · 执行归属 · 状态转换 · 事件持久化</text>

  <rect class="node state" x="70" y="610" width="300" height="100"/>
  <text class="label" x="220" y="648">SessionStore</text>
  <text class="detail" x="220" y="679">SQLite / 可选 PocketBase</text>
  <path class="edge bidirectional" d="M450 660 H370"/>

  <rect class="node state" x="1230" y="610" width="300" height="100"/>
  <text class="label" x="1380" y="648">RuntimeCoordinator</text>
  <text class="detail" x="1380" y="679">内存 / 多 worker 使用 Redis</text>
  <path class="edge bidirectional" d="M1150 660 H1230"/>

  <path class="edge" d="M800 710 V760"/>
  <rect class="node engine" x="450" y="760" width="700" height="90"/>
  <text class="label" x="800" y="798">TurnEngine → ChatOrchestrator</text>
  <text class="detail" x="800" y="829">通过 CapabilityCatalog / Registry 选择并创建能力</text>

  <path class="edge" d="M800 850 V900"/>
  <rect class="node engine" x="450" y="900" width="700" height="100"/>
  <text class="label" x="800" y="938">Capability / AgentLoop</text>
  <text class="detail" x="800" y="969">聊天、解题、研究、阅读、课程、掌握度学习、可视化等</text>

  <path class="event" d="M1150 950 H1190 V690 H1150"/>
  <text x="1215" y="917" transform="rotate(-90 1215 917)" font-size="16" fill="#2563eb">StreamBus · 流式事件</text>

  <rect x="70" y="773" width="300" height="215" rx="16" fill="#f8fafc"/>
  <text x="94" y="808" font-size="18" font-weight="650" fill="#334155">共享协议与扩展</text>
  <text class="note" x="94" y="843">UnifiedContext / StreamEvent</text>
  <text class="note" x="94" y="876">TurnCapability / LoopExtension</text>
  <text class="note" x="94" y="909">11 个内置回合能力</text>
  <text class="note" x="94" y="942">8 个用户可切换工具</text>
  <text class="path" x="220" y="970">其他工具按上下文与权限挂载</text>

  <rect x="1250" y="773" width="280" height="215" rx="16" fill="#f8fafc"/>
  <text x="1274" y="808" font-size="18" font-weight="650" fill="#334155">状态与回放</text>
  <text class="note" x="1274" y="843">session_id / turn_id / seq</text>
  <text class="note" x="1274" y="876">租约、续租与执行归属</text>
  <text class="note" x="1274" y="909">断线按事件游标续传</text>
  <text class="note" x="1274" y="942">worker 丢失后失败重试</text>
  <text class="path" x="1390" y="970">实时事件与持久化日志协同</text>

  <path class="edge" d="M800 1000 V1030 H415 V1070"/>
  <path class="edge" d="M800 1030 H1185 V1070"/>
  <text class="eyebrow" x="70" y="1054">04  工具与模型</text>

  <rect class="node tool" x="70" y="1070" width="690" height="115"/>
  <text class="label" x="415" y="1109">ToolRegistry 与业务服务</text>
  <text class="detail" x="415" y="1140">RAG / 搜索 / 文档 / 记忆 / 学习工具 / MCP / CLI / 沙箱</text>
  <text class="path" x="415" y="1168">知识库、附件、索引与产物保存在对应工作区</text>

  <rect class="node provider" x="840" y="1070" width="690" height="115"/>
  <text class="label" x="1185" y="1109">LLM Provider 适配层</text>
  <text class="detail" x="1185" y="1140">OpenAI / Anthropic / 兼容接口及其他供应商</text>
  <text class="path" x="1185" y="1168">统一模型配置、流式输出与用量统计</text>

  <line x1="70" y1="1220" x2="1530" y2="1220" stroke="#e2e8f0"/>
  <text class="note" x="70" y="1248">主图展示对话执行路径；知识库、文件、设置等 REST 管理接口直接调用相应业务服务。</text>
  <text class="note" x="70" y="1274">默认：SQLite + 内存协调。可选：PocketBase。多 worker：Redis。事件流与 RAG 链路见 docs-for-user/ARCHITECTURE.md。</text>
</svg>
